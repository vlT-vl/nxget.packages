id: teams
name: Microsoft Teams
publisher: Microsoft Corporation
category: Productivity
description: Microsoft's collaboration app for chat, meetings, calls and shared work.
about:
  it: >-
    Microsoft Teams è l'app di collaborazione di Microsoft per chat, riunioni,
    chiamate, condivisione di file e lavoro coordinato tra persone e gruppi.
    Il nuovo client desktop è distribuito da Microsoft come pacchetto MSIX per
    Windows x64 e ARM64 e come PKG universale per macOS. Su Linux Microsoft
    distribuisce Teams come applicazione web progressiva, quindi questo
    manifest non pubblica un installer Linux.
  en: >-
    Microsoft Teams is Microsoft's collaboration app for chat, meetings,
    calls, file sharing and coordinated work between people and groups. The
    new desktop client is distributed by Microsoft as an MSIX package for
    Windows x64 and ARM64 and as a universal PKG for macOS. On Linux,
    Microsoft distributes Teams as a progressive web app, so this manifest
    does not publish a Linux installer.
url: https://www.microsoft.com/microsoft-teams/
