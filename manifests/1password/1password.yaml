id: 1password
name: 1Password
publisher: 1Password
category: Security
description: A password manager that keeps logins, passkeys and secrets in an end-to-end encrypted vault.
about:
  it: >-
    1Password è un password manager che custodisce credenziali, passkey, codici
    di autenticazione a due fattori, carte e documenti in un vault cifrato
    end-to-end, protetto dalla password principale e da una Secret Key che
    non lascia mai i tuoi dispositivi. L'app desktop compila i moduli e
    propone password robuste tramite l'estensione del browser, sblocca il
    vault con Touch ID, Windows Hello o il riconoscimento del sistema, e si
    integra con SSH e con la riga di comando per gestire anche chiavi e
    segreti di sviluppo. Richiede un abbonamento a 1Password, con prova
    gratuita iniziale. Sincronizza i vault tra tutti i dispositivi
    dell'account.
  en: >-
    1Password is a password manager that keeps logins, passkeys,
    two-factor codes, cards and documents in an end-to-end encrypted vault,
    protected by your master password and a Secret Key that never leaves your
    devices. The desktop app fills in forms and suggests strong passwords
    through the browser extension, unlocks the vault with Touch ID, Windows
    Hello or system biometrics, and integrates with SSH and the command line
    to manage developer keys and secrets as well. It requires a 1Password
    subscription, with an initial free trial. Vaults sync across all the
    devices on the account.
