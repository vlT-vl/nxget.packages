id: helium
name: Helium
publisher: imput
category: Utility
description: A privacy-focused, Chromium-based desktop browser with Google's tracking and services removed.
about:
  it: >-
    Helium è un browser desktop basato su Chromium, costruito sopra
    ungoogled-chromium da imput (lo stesso duo dietro Cobalt e meow.camera),
    che rimuove tracciamento, telemetria e servizi in background di Google
    restando compatibile con le estensioni Chrome. Le build seguono da vicino
    Chromium a monte e vengono pubblicate da tre repository separati, uno per
    piattaforma (Windows, macOS, Linux), ciascuno con il proprio tag di
    release. È software libero con licenza GPL-3.0.
  en: >-
    Helium is a Chromium-based desktop browser, built on top of
    ungoogled-chromium by imput (the two-person team also behind Cobalt and
    meow.camera), that strips out Google's tracking, telemetry and background
    services while staying compatible with Chrome extensions. Builds follow
    upstream Chromium closely and are published from three separate
    per-platform repositories (Windows, macOS, Linux), each with its own
    release tag. It is free and open-source software under the GPL-3.0
    license.
