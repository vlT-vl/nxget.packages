id: photocraft
name: PhotoCraft
publisher: ArtCraft
category: Multimedia
description: An open source image editor written from scratch in pure Rust.
about:
  it: >-
    PhotoCraft è un editor di immagini open source scritto interamente in
    Rust. Offre livelli, maschere, livelli di regolazione, stili di livello,
    testo, vettori e pennelli in un'app nativa che funziona offline.
  en: >-
    PhotoCraft is an open source image editor written entirely in Rust. It
    offers layers, masks, adjustment layers, layer styles, type, vectors and
    brushes in a native app that works offline.
url: https://getartcraft.com/apps/photocraft
repo: https://github.com/storytold/photocraft
logo: https://raw.githubusercontent.com/vlT-vl/nxget.packages/api/manifests/photocraft/photocraft.png
license:
  name: Apache License 2.0 or MIT License
  url: https://raw.githubusercontent.com/storytold/photocraft/HEAD/LICENSE-APACHE
assets:
  - platform: windows
    arch: x64
    format: MSI
    match: '^photocraft-[\d.]+-windows-x64\.msi$'
  - platform: windows
    arch: arm64
    format: MSI
    match: '^photocraft-[\d.]+-windows-arm64\.msi$'
  - platform: macos
    arch: universal
    format: DMG
    match: '^photocraft-[\d.]+-macos-universal\.dmg$'
  - platform: linux
    arch: x64
    format: APPIMAGE
    match: '^photocraft-[\d.]+-linux-x86_64\.AppImage$'
  - platform: linux
    arch: arm64
    format: APPIMAGE
    match: '^photocraft-[\d.]+-linux-aarch64\.AppImage$'
