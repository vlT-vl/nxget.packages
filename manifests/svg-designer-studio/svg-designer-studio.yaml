    arch: x64
    format: ZIP
    match: '^build-windows-amd64\.zip$'
  - platform: macos
    arch: x64
    format: ZIP
    match: '^build-darwin-amd64\.zip$'
  - platform: macos
    arch: arm64
    format: ZIP
    match: '^build-darwin-arm64\.zip$'
  - platform: linux
    arch: x64
    format: ZIP
    match: '^build-linux-amd64\.zip$'
  - platform: linux
    arch: arm64
    format: ZIP
    match: '^build-linux-arm64\.zip$'
