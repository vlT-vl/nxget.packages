id: anycubic-slicer-next
name: Anycubic Slicer Next
publisher: Anycubic
category: Multimedia
description: Anycubic's open-source FDM slicer, based on OrcaSlicer and optimized for Anycubic printers.
about:
  it: >-
    Anycubic Slicer Next è lo slicer FDM open source di Anycubic, basato su
    OrcaSlicer e ottimizzato per le stampanti della serie Anycubic Kobra.
    Offre un motore di slicing potente, profili di stampa e di filamento già
    pronti, anteprima degli strati, supporti, calibrazione e invio dei lavori
    alla stampante in rete. Il pacchetto Linux ufficiale è distribuito solo
    come guida di installazione per Ubuntu 24.04, quindi qui sono pubblicati
    solo i programmi di installazione per Windows e macOS.
  en: >-
    Anycubic Slicer Next is Anycubic's open-source FDM slicer, based on
    OrcaSlicer and optimized for the Anycubic Kobra series of printers. It
    offers a powerful slicing engine, ready-made print and filament profiles,
    layer preview, supports, calibration and network sending of jobs to the
    printer. The official Linux package is only distributed as an install
    guide for Ubuntu 24.04, so only the Windows and macOS installers are
    published here.
